# Security headers.
#
# Kept in an include and repeated in every location block on purpose: nginx
# discards inherited `add_header` directives in any block that declares one of
# its own. Setting these only at `server` level silently loses them on every
# location that sets Cache-Control — which was the whole site.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
