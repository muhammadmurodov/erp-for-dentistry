name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        # The tests exercise composite foreign keys, check constraints and the
        # append-only audit trigger. None of that exists in SQLite, so a real
        # PostgreSQL is not optional here.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: erp_test
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ci-only-password
      # A throwaway value for the test run only. Production secrets come from
      # the deployment environment and never from a workflow file.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      LOG_LEVEL: WARNING
      LOG_FORMAT: console

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check app tests alembic

      - name: Check formatting
        run: .venv/bin/ruff format --check app tests alembic

      - name: Type check
        run: .venv/bin/mypy app
        continue-on-error: true  # advisory until the codebase is fully annotated

      - name: Verify migrations match the models
        # Catches a model change that was committed without its migration,
        # which would otherwise only surface on deploy.
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check

      - name: Verify the migrations are reversible
        run: |
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

      - name: Run tests
        run: .venv/bin/python -m pytest tests -v --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  secrets:
    name: No committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a committed .env
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked; it must stay out of version control"
            exit 1
          fi
          echo "No tracked .env."

      - name: Refuse a committed reference workbook
        # The workbook holds the clinic's bank details, employee salary
        # history and patient-level fiscal receipts.
        run: |
          if git ls-files | grep -iE '\.(xlsm|xlsx|xls)$'; then
            echo "::error::A spreadsheet is tracked; the reference workbook must stay untracked"
            exit 1
          fi
          echo "No tracked spreadsheets."

  docker:
    name: Images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t erp-backend:ci ./backend
      - name: Build frontend image
        run: docker build --target production -t erp-frontend:ci ./frontend
